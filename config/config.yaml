seed: 42

paths:
  raw_combined: data/raw/combined_amr_dataset.csv
  processed_dir: data/processed
  ui_dir: data/ui
  models_dir: models
  reports_eda: reports/eda
  reports_results: reports/results
  figures_eda: reports/figures/eda

sources:
  glass: GLASS-AMR
  ecdc: ECDC-EARSNet(Zenodo)

thresholds:
  high_risk_T: 30
  high_risk_sensitivity: [20, 50]
  rise_pp: 5
  min_tested: 30
  alpha: 0.05
  false_alert_rate_cap: 0.20

splits:
  glass:
    train_years: [2019, 2020, 2021]
    val_years: [2022]
    test_years: [2023]
    rolling_origin_val_years: [2020, 2021]
  ecdc:
    train_years: [1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
    val_years: [2016, 2017]
    test_years: [2018, 2019]
    rolling_origin_val_years: [2010, 2011, 2012, 2013, 2014, 2015]
  pooled:
    exclude_key_overlap_from_train: true

tuning:
  n_trials: 25
  n_bootstrap: 1000

models:
  logistic:
    C_range: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    l1_ratio_range: [0.0, 0.25, 0.5, 0.75, 1.0]
  random_forest:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 8, 12, null]
    min_samples_leaf: [1, 2, 5, 10]
    max_features: [sqrt, log2, 0.5]
  xgboost:
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    max_depth: [2, 3, 4, 5]
    reg_lambda: [0.1, 1.0, 5.0]
    reg_alpha: [0.0, 0.1, 1.0]
    gamma: [0.0, 0.1, 1.0]
    min_child_weight: [1, 3, 5]
    subsample: [0.7, 0.85, 1.0]
    colsample_bytree: [0.7, 0.85, 1.0]
  ridge:
    alpha_range: [0.01, 0.1, 1.0, 10.0, 100.0]

disclaimer: >
  Surveillance and research tool only. Not for treatment decisions.
  Predicted resistance is not the probability of clinical cure.
  High-risk and rising thresholds are project-defined, not clinical guidelines.
